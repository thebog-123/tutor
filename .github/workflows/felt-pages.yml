# Builds Felt (felt/) and publishes it to GitHub Pages.
# One-time setup is described in felt/README.md ("Deploy").
name: Felt website

on:
  push:
    branches: [claude/youthful-lamport-64uutg, main, claude/binder-tutoring-portal-331uua]
    paths: ['felt/**', '.github/workflows/felt-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: felt-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: felt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: felt/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build:deploy
        env:
          FELT_SUPABASE_URL: ${{ vars.FELT_SUPABASE_URL }}
          FELT_SUPABASE_ANON_KEY: ${{ vars.FELT_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: felt/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
